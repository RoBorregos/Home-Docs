# Golden set for retrieval evaluation.
#
# Each entry pairs a question with the source file(s) that should answer it.
# `expect` is a list because some questions are legitimately covered in more
# than one place; a hit on any listed file counts as correct.
#
# Questions are phrased the way a team member would ask them, deliberately not
# reusing the wording of the headings they should match. Copying heading text
# would only measure string overlap.
#
# Caveat: these were written by reading the docs, so they inherit that reading.
# Have the area leads review and extend them before trusting absolute numbers.

# --- Hardware ---------------------------------------------------------------
- query: "which camera does the robot use?"
  expect: ["Overview/Hardware.md"]

- query: "what lidar is mounted on the robot?"
  expect: ["Overview/Hardware.md"]

- query: "what onboard computer runs everything?"
  expect: ["Overview/Hardware.md"]

- query: "how many batteries does FRIDA carry and at what voltage?"
  expect: ["Overview/Hardware.md"]

- query: "what microcontroller is inside the gripper?"
  expect: ["Overview/Hardware.md"]

- query: "what mobile base is the robot built on?"
  expect: ["Overview/Hardware.md"]

- query: "what microphone and speaker are used for speech?"
  expect: ["Overview/Hardware.md"]

